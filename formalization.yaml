# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "Myerson-Satterthwaite impossibility theorem (continuous bilateral-trade version)"
  description: >-
    Formalizes the continuous-type bilateral-trade impossibility result: no
    mechanism can satisfy ex post efficiency, Bayesian incentive compatibility,
    interim individual rationality, and weak budget balance when buyer and
    seller supports overlap. The proof uses payoff equivalence and envelope
    identities, together with the strict rent-gap identity B + C > S.
  authors: ["Arthur Freitas Ramos"]
  license: "BSD-3-Clause"
  responsible_maintainers: ["Arthur Freitas Ramos"]

classification:
  arxiv: ["econ.TH", "cs.GT"]
  msc2020: ["91B26"]

sources:
  - title: "Efficient Mechanisms for Bilateral Trading"
    authors:
      - "Roger B. Myerson"
      - "Mark A. Satterthwaite"
    id: "https://doi.org/10.1016/0022-0531(83)90048-0"
    type: "article"
    location: "https://doi.org/10.1016/0022-0531(83)90048-0"
    relationship: "formalizes"
    author_endorsement: "not-contacted"
    note: >-
      Establishes the impossibility of efficient bilateral trade under private
      information when buyer and seller values overlap, subject to incentive
      compatibility, individual rationality, and budget balance.

status:
  scope: >-
    The library formalizes continuous buyer values and seller costs on compact
    intervals, atomless full-support probability measures absolutely continuous
    with respect to Lebesgue measure, allocation and transfer rules, ex post
    efficiency, Bayesian incentive compatibility, interim individual
    rationality, and weak ex ante budget balance. Challenge.lean carries exactly
    one deliberate statement hole, excluded from the implementation sorry_count.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Quot.sound", "Classical.choice"]

automation:
  methods:
    - method: "agent"
      models: ["gpt-6-luna (Codex CLI)"]
      framework: "Lean 4 and Mathlib"
      tool_setup: "Pinned Lean/Mathlib builds, closure-safe Challenge compilation, and Comparator-ready metadata."
      cost:
        wall_time: "not tracked"
        spend_usd: "subscription-based"
        hardware: "local machine"
      prompting_notes: "AI assistance was used for proof engineering. The final definitions, statements, and proofs are checked by Lean's kernel."
  spend_usd: "subscription-based"
  notes: "AI assistance was used for proof engineering. The final definitions, statements, and proofs are checked by Lean's kernel."

fidelity:
  divergences: >-
    Continuous types on compact intervals; atomless full-support distributions
    absolutely continuous with respect to Lebesgue measure (positive densities);
    BIC and interim IR are stated in the restricted one-sided-deviation envelope
    form; budget balance is weak and ex ante; interim quantities are Bochner
    integrals.

alignment:
  namespace: "MS.Palomar"
  statements:
    - source: "Buyer interim trade probability"
      lean: "interimQ"
      module: "Challenge.lean"
      status: "defined"
      note: "The Bochner integral of q(v,c) over the seller distribution nu, with binders (q : ℝ × ℝ → ℝ) (nu : Measure ℝ) (v : ℝ)."
    - source: "Seller interim trade probability"
      lean: "interimR"
      module: "Challenge.lean"
      status: "defined"
      note: "The Bochner integral of q(v,c) over the buyer distribution mu, with binders (q : ℝ × ℝ → ℝ) (mu : Measure ℝ) (c : ℝ)."
    - source: "Buyer interim utility"
      lean: "interimU"
      module: "Challenge.lean"
      status: "defined"
      note: "The Bochner integral of v * q(v,c) - tb(v,c) over nu, with binders (q tb : ℝ × ℝ → ℝ) (nu : Measure ℝ) (v : ℝ)."
    - source: "Seller interim utility"
      lean: "interimW"
      module: "Challenge.lean"
      status: "defined"
      note: "The Bochner integral of tc(v,c) - c * q(v,c) over mu, with binders (q tc : ℝ × ℝ → ℝ) (mu : Measure ℝ) (c : ℝ)."
    - source: "Type-interval overlap conditions"
      lean: "MS.Overlap"
      module: "Challenge.lean"
      status: "defined"
      note: "For intervals [a1,b1] and [a2,b2], asserts both are nontrivial and that a2 < b1 and a1 < b2."
    - source: "Continuous bilateral-trade model"
      lean: "MS.IsModel"
      module: "Challenge.lean"
      status: "defined"
      note: "A proposition with binders (a1 b1 a2 b2 : ℝ) (mu nu : Measure ℝ) (q tb tc : ℝ × ℝ → ℝ), packaging the overlap, distributions, rules, efficiency, BIC, interim IR, and weak ex ante budget balance assumptions."
    - source: "Myerson-Satterthwaite impossibility theorem"
      lean: "MS.Palomar.myersonSatterthwaite"
      module: "MS/Palomar.lean"
      status: "proved"
      note: "For binders (a1 b1 a2 b2 : ℝ) (mu nu : Measure ℝ) (q tb tc : ℝ × ℝ → ℝ) and h : MS.IsModel a1 b1 a2 b2 mu nu q tb tc, concludes False."

acknowledgements: >-
  Mathlib contributors; Roger B. Myerson and Mark A. Satterthwaite; and the
  Palomar Registry project for the statement/solution Comparator workflow.

review:
  status: "self-assessed"
  reviewers: ["none"]
  notes: >-
    A registry/web search on 2026-09-26 found no prior Palomar entries for this
    theorem; a public prior-art survey reports no known formalization in any
    proof assistant. Challenge contains one deliberate statement hole, excluded
    from the implementation sorry_count. Hosted Comparator verification,
    Palomar editorial review, and registration are separate states and are not
    inferred from local compilation.
